{% extends "base.html" %}

{% block title %}Error del servidor — FastJob{% endblock %}

{% block content %}
<div class="max-w-md lg:max-w-lg mx-auto px-4 py-16 text-center">
  <div data-reveal data-reveal-delay="0" class="bg-white rounded-2xl shadow-sm border border-brand-muted p-6 sm:p-8 motion-safe:transition-all motion-safe:duration-500 motion-safe:ease-out">
    <div class="text-brand-dark mb-4 flex justify-center">
      <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <p class="text-display font-extrabold text-brand-dark mb-2 leading-none">500</p>
    <h1 class="text-h2 font-bold mb-2 text-brand-ink">Error del servidor</h1>
    <p class="text-gray-500 mb-8">Lo sentimos, algo ha ido mal en nuestros servidores. Estamos trabajando para solucionarlo.</p>
    <a href="/" class="inline-flex items-center justify-center w-full min-h-[44px] bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-xl transition shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-ring focus:ring-offset-2">
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
