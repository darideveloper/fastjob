{% extends "base.html" %}
{% block title %}Cancelar suscripción — FastJob{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-20 text-center">
  <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
  </div>
  <h1 class="text-2xl font-bold mb-3">¿Cancelar suscripción?</h1>
  <p class="text-gray-600 mb-6">
    El email <strong>{{ masked_email }}</strong> dejará de recibir CVs a través de FastJob.
  </p>
  <form method="post" action="">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-lg transition">
      Confirmar baja
    </button>
  </form>
</div>
{% endblock %}
