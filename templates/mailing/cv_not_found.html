{% extends "base.html" %}
{% load static %}
{% block title %}CV no disponible — FastJob{% endblock %}

{% block navbar %}
<nav class="bg-white border-b border-brand-muted">
  <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
    <a href="/" class="inline-flex items-center shrink-0">
      <picture>
        <source srcset="{% static 'images/fastjob-logo.webp' %}" type="image/webp" />
        <img src="{% static 'images/fastjob-logo.png' %}" alt="FastJob" width="120" height="44" class="h-11 w-auto block" loading="eager" />
      </picture>
    </a>
  </div>
</nav>
{% endblock navbar %}

{% block content %}
<div class="max-w-md lg:max-w-lg mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl shadow-sm border border-brand-muted p-6 sm:p-8 text-center">
    <picture>
        <source srcset="{% static 'images/fastjob-logo.webp' %}" type="image/webp" />
        <img src="{% static 'images/fastjob-logo.png' %}" alt="FastJob" width="160" height="59" class="h-14 w-auto mx-auto block mb-4" />
      </picture>
    <div class="w-20 h-20 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
    </div>
    <h1 class="text-h2 font-bold mb-3 text-brand-ink">Enlace no disponible</h1>
    <p class="text-gray-500 mb-8">Este enlace ya no está disponible o ha expirado.</p>
    <a href="/" class="inline-flex items-center justify-center min-h-[44px] text-brand-dark hover:bg-brand-muted font-semibold px-5 py-3 rounded-xl transition focus:outline-none focus:ring-2 focus:ring-brand-ring focus:ring-offset-2">
      Ir a FastJob
    </a>
  </div>
</div>
{% endblock %}
