<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; color: #333; }
    .header { padding: 20px; text-align: center; }
    .footer { padding: 20px; font-size: 12px; color: #777; text-align: center; border-top: 1px solid #eee; }
    .content { padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="{{ logo_url }}" alt="Logo" style="max-width: 150px;">
  </div>
  <div class="content" style="border-top: 2px solid {{ brand_color }};">
    {{ body_html|safe }}
  </div>
  <div class="footer">
    {{ footer_text|safe }}
  </div>
</body>
</html>
