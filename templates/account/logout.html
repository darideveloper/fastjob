{% extends "base.html" %}

{% block title %}Cerrar sesión — FastJob{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <div class="text-brand mb-4 flex justify-center">
      <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold mb-2 text-gray-900">¿Cerrar sesión?</h1>
    <p class="text-gray-500 mb-8">¿Estás seguro de que deseas salir de tu cuenta?</p>
    
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      <div class="space-y-3">
        <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-xl transition shadow-sm">
          Cerrar sesión
        </button>
        <a href="{% url 'dashboard' %}" class="block w-full bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl transition border border-gray-200">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
