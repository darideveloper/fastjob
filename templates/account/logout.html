{% extends "base.html" %}

{% block title %}Cerrar sesión — FastJob{% endblock %}

{% load static %}
{% block content %}
<div class="max-w-md lg:max-w-lg mx-auto px-4 py-16 text-center">
  <div class="bg-white rounded-2xl shadow-sm border border-brand-muted p-6 sm:p-8">
    <picture>
        <source srcset="{% static 'images/fastjob-logo.webp' %}" type="image/webp" />
        <img src="{% static 'images/fastjob-logo.png' %}" alt="FastJob" width="160" height="59" class="h-14 w-auto mx-auto block mb-4" />
      </picture>
    <div class="text-brand-dark mb-4 flex justify-center">
      <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold mb-2 text-brand-ink">¿Cerrar sesión?</h1>
    <p class="text-gray-500 mb-8">¿Estás seguro de que deseas salir de tu cuenta?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      <div class="space-y-3">
        <button type="submit" class="w-full min-h-[44px] bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-xl transition shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-ring focus:ring-offset-2">
          Cerrar sesión
        </button>
        <a href="{% url 'dashboard' %}" class="block w-full min-h-[44px] text-brand-dark hover:bg-brand-muted font-semibold py-3 rounded-xl transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
