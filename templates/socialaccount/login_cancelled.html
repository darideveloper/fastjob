{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Login Cancelled" %} — FastJob{% endblock %}

{% load static %}
{% block content %}
<div class="max-w-md lg:max-w-lg mx-auto px-4 py-16 text-center">
  <div class="bg-white rounded-2xl shadow-sm border border-brand-muted p-6 sm:p-8">
    <picture>
        <source srcset="{% static 'images/fastjob-logo.webp' %}" type="image/webp" />
        <img src="{% static 'images/fastjob-logo.png' %}" alt="FastJob" width="160" height="59" class="h-14 w-auto mx-auto block mb-4" />
      </picture>
    <div class="text-brand-dark mb-4 flex justify-center">
      <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold mb-2 text-brand-ink">Inicio de sesión cancelado</h1>
    <p class="text-brand-ink/70 mb-8">Has cancelado el proceso de inicio de sesión con tu cuenta social.</p>
    <a href="{% url 'account_login' %}" class="inline-flex items-center justify-center w-full min-h-[44px] bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-xl transition shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-ring focus:ring-offset-2">
      Volver a iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
